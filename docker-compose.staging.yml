services:
  web:
    image: hardhat-website:${APP_TAG}
    container_name: hh-staging
    env_file: .env
    environment:
      DB_ENGINE: ""
      DEBUG: "True"
      APP_ENV: staging
    command: "sh -c 'echo SIMULATED FAILURE FOR ROLLBACK DEMO && exit 1'"
    ports:
      - "8001:8000"
    networks:
      - devops-net
    restart: unless-stopped

networks:
  devops-net:
    external: true